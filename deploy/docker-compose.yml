version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adnet-postgres
    environment:
      POSTGRES_DB: adnet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/adnet/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adnet-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: adnet-api
    environment:
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/adnet?sslmode=disable
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  adserve:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.adserve
    container_name: adnet-adserve
    environment:
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  eventd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.eventd
    container_name: adnet-eventd
    environment:
      REDIS_URL: redis:6379
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/adnet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  reconciler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.reconciler
    container_name: adnet-reconciler
    environment:
      REDIS_URL: redis:6379
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/adnet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  billingd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.billingd
    container_name: adnet-billingd
    environment:
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/adnet?sslmode=disable
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-sandbox}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-http://localhost:8083/callback}
      PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  advertiser-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.advertiser-portal
    container_name: adnet-advertiser-portal
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  publisher-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.publisher-portal
    container_name: adnet-publisher-portal
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped

  admin-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin-portal
    container_name: adnet-admin-portal
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    restart: unless-stopped

  email-renderer:
    build:
      context: ../email-renderer
      dockerfile: Dockerfile
    container_name: adnet-email-renderer
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3004:3000"
    restart: unless-stopped

  emailer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.emailer
    container_name: adnet-emailer
    environment:
      EMAIL_RENDERER_URL: http://email-renderer:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@otexads.com}
      PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      - email-renderer
    restart: unless-stopped

volumes:
  postgres_data:
