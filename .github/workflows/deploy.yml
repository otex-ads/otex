name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Advertiser Portal
        run: |
          if [ -d "advertiser-portal" ]; then
            cd advertiser-portal
            npm install
            npm run build
          else
            echo "advertiser-portal directory not found"
            exit 1
          fi

      - name: Build Publisher Portal
        run: |
          if [ -d "publisher-portal" ]; then
            cd publisher-portal
            npm install
            npm run build
          else
            echo "publisher-portal directory not found"
            exit 1
          fi

      - name: Build Admin Portal
        run: |
          if [ -d "admin-portal" ]; then
            cd admin-portal
            npm install
            npm run build
          else
            echo "admin-portal directory not found"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/adnet && git pull origin main"

      - name: Rebuild and restart Docker containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/adnet/deploy && docker compose down && docker compose build && docker compose up -d"

      - name: Run database migrations
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/adnet/deploy && docker compose exec -e PGPASSWORD=NkdTLkQHwFKYpfQIL4TgRalTPPpqAzq8 -T postgres psql -U postgres -d adnet < ../migrations/000002_payment_ledger.up.sql || true"

      - name: Deploy Advertiser Portal
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -rf /opt/advertiser-portal/.output"
          scp -o StrictHostKeyChecking=no -r advertiser-portal/.output ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/advertiser-portal/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "pkill -f 'advertiser-portal' || true"
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/advertiser-portal && nohup node .output/server/index.mjs > advertiser-portal.log 2>&1 &"

      - name: Deploy Publisher Portal
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -rf /opt/publisher-portal/.output"
          scp -o StrictHostKeyChecking=no -r publisher-portal/.output ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/publisher-portal/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "pkill -f 'publisher-portal' || true"
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/publisher-portal && nohup node .output/server/index.mjs > publisher-portal.log 2>&1 &"

      - name: Deploy Admin Portal
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "rm -rf /opt/admin-portal/.output"
          scp -o StrictHostKeyChecking=no -r admin-portal/.output ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/admin-portal/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "pkill -f 'admin-portal' || true"
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd /opt/admin-portal && nohup node .output/server/index.mjs > admin-portal.log 2>&1 &"
