server {
    listen 80;
    server_name adserve.yourdomain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name adserve.yourdomain.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/adserve.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adserve.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/adserve-access.log;
    error_log /var/log/nginx/adserve-error.log;

    # Proxy Settings
    location / {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts (adserve needs fast response)
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Health check endpoint
    location /healthz {
        proxy_pass http://localhost:8081/healthz;
        access_log off;
    }
}
